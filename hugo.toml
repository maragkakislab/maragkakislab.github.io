[params]
  env = 'production'
  title = 'Maragkakis Lab'
  description = 'The Maragkakis Lab studies the high-dimensional regulation of gene expression to uncover the mechanistic basis of aging physiology and disease.'

  ShowReadingTime = false
  ShowShareButtons = false
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  ShowCodeCopyButtons = true
  ShowToc = false
  disableSpecial1stPost = true
  disableScrollToTop = false
