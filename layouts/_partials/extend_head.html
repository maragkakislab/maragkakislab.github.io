<style>
/* ===================================================================
   Accent color — deep blue drawn from the research-directions figure.
   Used sparingly (links, active nav, buttons, tags, card hover) to add
   character while keeping the design minimal.
   =================================================================== */
:root {
  --accent: #1f4e9b;
  --accent-hover: #15397a;
  --accent-soft: rgba(31, 78, 155, 0.08);
}
:root[data-theme="dark"] {
  --accent: #7da8ff;
  --accent-hover: #a3c2ff;
  --accent-soft: rgba(125, 168, 255, 0.12);
}

/* Links: prose, metadata, and publication buttons */
.post-content a,
.post-description a,
.entry-footer a,
.publication-link a,
.pub-source-link {
  color: var(--accent);
  text-decoration-color: var(--accent);
}
.post-content a:hover,
.post-description a:hover,
.entry-footer a:hover,
.publication-link a:hover,
.pub-source-link:hover {
  color: var(--accent-hover);
}

/* Navigation: active item and hover */
.menu .active {
  color: var(--accent);
}
.menu a:hover {
  color: var(--accent);
  opacity: 1;
}

/* Tag chips */
.post-tags a:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* Card hover: accent border only — no motion (cancels the theme's lift) */
.post-entry {
  transition: none;
}
.post-entry:hover,
.post-entry:focus-within {
  transform: none;
  box-shadow: none;
  border-color: var(--accent);
}

/* Short accent rule under section headers (Publications, People, Research) */
.page-header > h1 {
  display: inline-block;
  padding-bottom: 6px;
  border-bottom: 3px solid var(--accent);
}

/* People list */
.people-card {
  display: flex;
  align-items: center;
  gap: 1.2rem;
}
.people-card .people-photo {
  flex-shrink: 0;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
}
.people-card .people-photo-placeholder {
  flex-shrink: 0;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--border, #e0e0e0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: var(--secondary, #aaa);
}

/* Publication links */
.entry-footer a, .post-description a {
  text-decoration: underline;
}
/* Lift the source link above the card-wide overlay link (.entry-link)
   so it is individually clickable in the publication list view. */
.pub-source-link {
  position: relative;
  z-index: 1;
}
.publication-link {
  margin-bottom: 1rem;
}
.publication-link a {
  text-decoration: underline;
  font-weight: 500;
}

/* People single page */
.people-single-header {
  display: flex;
  align-items: flex-start;
  gap: 2rem;
  margin-bottom: 1.5rem;
}
.people-single-photo {
  flex-shrink: 0;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  object-fit: cover;
}
.people-single-info h1 {
  margin-top: 0;
}

/* Footer disclaimer */
.footer-disclaimer {
  font-size: 0.75rem;
  color: var(--secondary, #aaa);
}

/* Home hero: enlarged headline (theme default is 34px).
   Mobile size is set in the media query below. */
.home-info .entry-header h1 {
  font-size: 2.4rem;
  line-height: 1.15;
  margin-bottom: 0.5rem;
}

/* Lightly framed schematic. */
.home-info .entry-content img {
  border: 1px solid var(--tertiary);
  border-radius: var(--radius);
  box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
}

/* Mobile */
@media (max-width: 640px) {
  .post-title {
    font-size: 1.5rem;
    line-height: 1.3;
  }

  /* Section headers: Publications, People, Research */
  .page-header h1 {
    font-size: 1.7rem;
    line-height: 1.3;
  }

  /* Home hero headline */
  .first-entry .entry-header h1 {
    font-size: 1.4rem;
    line-height: 1.2;
  }

  /* Individual entry titles in lists */
  .entry-header h2 {
    font-size: 1.25rem;
    line-height: 1.3;
  }

  .people-single-header {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1rem;
  }

  .people-single-photo {
    width: 120px;
    height: 120px;
  }

  .people-single-info {
    width: 100%;
  }

  .people-single-info h1 {
    font-size: 1.4rem;
  }
}
</style>
