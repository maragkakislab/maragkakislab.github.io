<style>
/* ===================================================================
   Accent color — deep blue drawn from the research-directions figure.
   Used sparingly (links, active nav, buttons, tags, card hover) to add
   character while keeping the design minimal.
   =================================================================== */
:root {
  --accent: #1f4e9b;
  --accent-hover: #15397a;
  --accent-soft: rgba(31, 78, 155, 0.08);
}
:root[data-theme="dark"] {
  --accent: #7da8ff;
  --accent-hover: #a3c2ff;
  --accent-soft: rgba(125, 168, 255, 0.12);
}

/* Links: prose, metadata, and publication buttons */
.post-content a,
.post-description a,
.entry-footer a,
.publication-link a,
.pub-source-link {
  color: var(--accent);
  text-decoration-color: var(--accent);
}
.post-content a:hover,
.post-description a:hover,
.entry-footer a:hover,
.publication-link a:hover,
.pub-source-link:hover {
  color: var(--accent-hover);
}

/* Navigation: active item and hover */
.menu .active {
  color: var(--accent);
}
.menu a:hover {
  color: var(--accent);
  opacity: 1;
}

/* Tag chips */
.post-tags a:hover {
  color: var(--accent);
  border-color: var(--accent);
  background: var(--accent-soft);
}

/* Card hover: accent border only — no motion (cancels the theme's lift) */
.post-entry {
  transition: none;
}
.post-entry:hover,
.post-entry:focus-within {
  transform: none;
  box-shadow: none;
  border-color: var(--accent);
}

/* Short accent rule under section headers (Publications, People, Research) */
.page-header > h1 {
  display: inline-block;
  padding-bottom: 6px;
  border-bottom: 3px solid var(--accent);
}

/* People list */
.people-card {
  display: flex;
  align-items: center;
  gap: 1.2rem;
}
.people-card .people-photo {
  flex-shrink: 0;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  object-fit: cover;
}
.people-card .people-photo-placeholder {
  flex-shrink: 0;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  background: var(--border, #e0e0e0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 2rem;
  color: var(--secondary, #aaa);
}

/* Publication links */
.entry-footer a, .post-description a {
  text-decoration: underline;
}
/* Lift the source link above the card-wide overlay link (.entry-link)
   so it is individually clickable in the publication list view. */
.pub-source-link {
  position: relative;
  z-index: 1;
}
.publication-link {
  margin-bottom: 1rem;
}
.publication-link a {
  text-decoration: underline;
  font-weight: 500;
}

/* People single page */
.people-single-header {
  display: flex;
  align-items: flex-start;
  gap: 2rem;
  margin-bottom: 1.5rem;
}
.people-single-photo {
  flex-shrink: 0;
  width: 160px;
  height: 160px;
  border-radius: 50%;
  object-fit: cover;
}
.people-single-info h1 {
  margin-top: 0;
}

/* Home page: members row + recent publications */
.home-section {
  margin-top: 2.5rem;
}
.home-section-title {
  display: inline-block;
  font-size: 1.5rem;
  padding-bottom: 6px;
  margin-bottom: 1.5rem;
  border-bottom: 3px solid var(--accent);
}
.home-members-grid {
  display: flex;
  flex-wrap: wrap;
  gap: 1.1rem;
}
.home-member {
  display: flex;
  flex-direction: column;
  align-items: center;
  width: 68px;
  text-align: center;
  text-decoration: none;
  color: inherit;
}
.home-member-photo,
.home-member-photo-placeholder {
  width: 56px;
  height: 56px;
  border-radius: 50%;
  object-fit: cover;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}
.home-member-photo-placeholder {
  background: var(--border, #e0e0e0);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.3rem;
  color: var(--secondary, #aaa);
}
.home-member:hover .home-member-photo,
.home-member:hover .home-member-photo-placeholder {
  transform: scale(1.08);
  box-shadow: 0 0 0 3px var(--accent-soft), 0 0 0 1px var(--accent);
}
.home-member-name {
  margin-top: 0.5rem;
  font-size: 0.82rem;
  white-space: nowrap;
}
.home-publications-list {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}
.home-section-more {
  display: inline-block;
  margin-top: 1.25rem;
  font-size: 0.95rem;
  text-decoration: underline;
  color: var(--accent);
}
.home-section-more:hover {
  color: var(--accent-hover);
}

/* Footer disclaimer */
.footer-disclaimer {
  font-size: 0.75rem;
  color: var(--secondary, #aaa);
}

/* Home hero: enlarged headline (theme default is 34px).
   Mobile size is set in the media query below. */
.home-info .entry-header h1 {
  font-size: 2.4rem;
  line-height: 1.15;
  margin-bottom: 0.5rem;
}

/* Mobile */
@media (max-width: 640px) {
  .post-title {
    font-size: 1.5rem;
    line-height: 1.3;
  }

  /* Section headers: Publications, People, Research */
  .page-header h1 {
    font-size: 1.7rem;
    line-height: 1.3;
  }

  /* Home hero headline */
  .first-entry .entry-header h1 {
    font-size: 1.4rem;
    line-height: 1.2;
  }

  /* Home page subsection headers (Meet the Team, Recent Publications) —
     smaller than the hero headline above, since they're subordinate to it. */
  .home-section-title {
    font-size: 1.15rem;
  }

  /* Individual entry titles in lists */
  .entry-header h2 {
    font-size: 1.25rem;
    line-height: 1.3;
  }

  /* Recent-publications teaser cards on the home page: titles run long
     (full paper titles), so they need a smaller cap than regular list
     entries to avoid dominating a narrow screen. */
  .home-publication-card .entry-header h2 {
    font-size: 1.05rem;
    line-height: 1.35;
  }
  .home-publication-card .post-description {
    font-size: 0.7rem;
    margin-top: 4px;
  }

  .people-single-header {
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 1rem;
  }

  .people-single-photo {
    width: 120px;
    height: 120px;
  }

  .people-single-info {
    width: 100%;
  }

  .people-single-info h1 {
    font-size: 1.4rem;
  }
}
</style>
